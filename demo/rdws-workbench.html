<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>RDWS 产研工作台 · 全新设计探索稿 v2</title>
<style>

/* ============ 1. 设计令牌 ============ */
:root{
  color-scheme:light;
  --brand-50:#F1F8FA; --brand-100:#E2F1F5; --brand-200:#BBDDE6; --brand-300:#8FC7D4;
  --brand-500:#0E7490; --brand-600:#0C6279; --brand-700:#0B596E; --brand-900:#083F4D;
  --on-brand:#FFFFFF;
  --ink-900:#16212B; --ink-700:#31414E; --ink-600:#415260; --ink-500:#546572; --ink-400:#5E6E7B;
  --line:#E3EAED; --line-2:#EDF2F4; --line-strong:#CFD9DE;
  --paper:#FFFFFF; --canvas:#FBFDFD; --rail:#F5F8F9; --rail-2:#EEF3F5; --hover:#E9F1F3;
  --ok:#1D7357; --ok-bg:#EAF5F0; --ok-line:#C8E6D8;
  --warn:#96600E; --warn-bg:#FDF4E3; --warn-line:#EBD6AC;
  --danger:#AE3437; --danger-bg:#FCEDEC; --danger-line:#EFCBC9;
  --shadow-1:0 1px 2px rgba(16,40,50,.05);
  --shadow-2:0 12px 32px rgba(16,40,50,.12);
  --rail-w:248px;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.22,.9,.28,1);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --brand-50:#102A33; --brand-100:#153B47; --brand-200:#1D5566; --brand-300:#2B7891;
  --brand-500:#48B6D1; --brand-600:#63C4DC; --brand-700:#8AD5E8; --brand-900:#C4ECF5;
  --on-brand:#0B2029;
  --ink-900:#EAF2F5; --ink-700:#CFDCE2; --ink-600:#BCCCD4; --ink-500:#A3B6C0; --ink-400:#8AA0AB;
  --line:#2A3A43; --line-2:#223139; --line-strong:#3A4E58;
  --paper:#131C22; --canvas:#10181D; --rail:#162127; --rail-2:#1B2830; --hover:#20323B;
  --ok:#6CCFA6; --ok-bg:#123126; --ok-line:#20503D;
  --warn:#E3B464; --warn-bg:#352A15; --warn-line:#5A4622;
  --danger:#F08E8E; --danger-bg:#3A1E20; --danger-line:#663336;
  --shadow-1:0 1px 2px rgba(0,0,0,.28);
  --shadow-2:0 12px 32px rgba(0,0,0,.42);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink-900);font-family:var(--f-ui);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:var(--brand-600);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px;border-radius:4px}
::selection{background:var(--brand-200);color:var(--ink-900)}
caret-color:var(--brand-500);
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line-strong);border:3px solid transparent;background-clip:padding-box;border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:var(--ink-400);border:3px solid transparent;background-clip:padding-box}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:-3px}
.ico.sm{width:14px;height:14px}
.ico.lg{width:18px;height:18px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-500)}
.dim{color:var(--ink-400)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ 2. 应用骨架 ============ */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);height:100dvh;min-height:0}
.app.rail-collapsed{--rail-w:64px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper)}
.content{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;background:var(--canvas)}

/* ---- 左栏 ---- */
.rail{display:flex;flex-direction:column;min-height:0;background:var(--rail);border-right:1px solid var(--line)}
.rail-head{padding:16px 14px 10px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 14px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--brand-500);display:grid;place-items:center;color:var(--on-brand);flex:none}
.brand-mark .ico{width:17px;height:17px;stroke-width:1.9}
.brand-txt{min-width:0}
.brand-name{display:block;font-size:16px;font-weight:700;letter-spacing:-.03em;line-height:1.15;color:var(--ink-900)}
.brand-sub{display:block;font-size:11px;color:var(--ink-500);letter-spacing:.02em;white-space:nowrap}
.btn-new{width:100%;height:38px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--paper);display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;box-shadow:var(--shadow-1);transition:background .15s,border-color .15s,transform .15s}
.btn-new:hover{background:var(--brand-50);border-color:var(--brand-300);transform:translateY(-1px)}
.rail-nav{padding:12px 8px 6px;display:flex;flex-direction:column;gap:1px}
.nav-i{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:var(--r-sm);color:var(--ink-600);font-size:12.5px;text-align:left;width:100%;transition:background .14s,color .14s}
.nav-i:hover{background:var(--hover);color:var(--ink-900)}
.nav-i.on{background:var(--brand-50);color:var(--brand-700);font-weight:600}
.nav-i .ico{color:var(--ink-400)}
.nav-i.on .ico{color:var(--brand-500)}
.nav-i .tag{margin-left:auto;font-size:11px;padding:1px 5px;border:1px solid var(--line-strong);border-radius:4px;color:var(--ink-500);font-weight:500}
.rail-div{height:1px;background:var(--line);margin:12px 12px 0}
.proj{padding:12px 12px 8px}
.proj-lab{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink-500);margin:0 2px 7px}
.proj-btn{width:100%;display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);text-align:left;box-shadow:var(--shadow-1)}
.proj-btn:hover{border-color:var(--brand-300)}
.proj-sq{width:24px;height:24px;border-radius:6px;background:var(--brand-100);color:var(--brand-700);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.proj-nm{display:block;font-size:12.5px;font-weight:600;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-mt{display:block;font-size:11px;color:var(--ink-500);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-btn .ico:last-child{margin-left:auto;color:var(--ink-400)}
.tree-head{display:flex;align-items:center;gap:2px;padding:10px 14px 6px}
.tree-head strong{font-size:11px;letter-spacing:.06em;color:var(--ink-600);font-weight:700}
.tree-tools{margin-left:auto;display:flex;gap:1px}
.iconbtn{width:26px;height:26px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-500);transition:background .14s,color .14s}
.iconbtn:hover{background:var(--hover);color:var(--ink-900)}
.iconbtn.on{color:var(--brand-600);background:var(--brand-50)}
.tree-search{padding:0 12px 8px;position:relative;display:none}
.tree-search.on{display:block}
.tree-search input{width:100%;height:30px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--paper);padding:0 9px 0 28px;font-size:12px;outline:none}
.tree-search input:focus{border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-50)}
.tree-search .ico{position:absolute;left:20px;top:7px;color:var(--ink-400)}
.rail-scroll{flex:1;min-height:0;overflow:auto;padding:0 8px 10px}
.tree-group{margin-bottom:3px}
.tree-lbl{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-500)}
.tree-lbl .cnt{margin-left:auto;font-weight:500;color:var(--ink-400)}
.dnode{border-radius:var(--r-sm);margin-bottom:1px}
.dnode-main{display:flex;align-items:center;gap:7px;width:100%;height:32px;padding:0 7px;border-radius:var(--r-sm);color:var(--ink-700);text-align:left;transition:background .14s}
.dnode-main:hover{background:var(--hover)}
.dnode.sel .dnode-main{background:var(--brand-50);color:var(--brand-700)}
.dnode .chev{transition:transform .18s var(--ease);color:var(--ink-400);width:12px;height:12px}
.dnode.open .chev{transform:rotate(90deg)}
.dnode .ico.fold{width:14px;height:14px;color:var(--ink-400)}
.dnode.sel .ico.fold{color:var(--brand-500)}
.dnode-name{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.dnode-time{font-size:11px;color:var(--ink-400);flex:none}
.sessions{display:none;padding:1px 0 5px 17px;border-left:1px solid var(--line);margin-left:15px}
.dnode.open .sessions{display:block}
.sitem{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:6px;width:100%;height:29px;padding:0 8px;border-radius:var(--r-sm);color:var(--ink-600);font-size:11.5px;text-align:left}
.sitem:hover{background:var(--hover);color:var(--ink-900)}
.sitem.on{background:var(--paper);color:var(--brand-700);font-weight:600;box-shadow:var(--shadow-1)}
.sitem .sname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sitem .stime{font-size:11px;color:var(--ink-400);text-align:right;justify-self:end;white-space:nowrap}
.smode{width:18px;height:18px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:4px;background:var(--paper);color:var(--ink-500);font-size:11px;font-weight:650;line-height:1;justify-self:start;flex:none}
.smode.w{background:var(--brand-500);border-color:var(--brand-500);color:var(--on-brand)}
.sitem.on .smode{border-color:var(--brand-200)}
.tree-empty{padding:22px 10px;text-align:center;color:var(--ink-500);font-size:12px}
.rail-foot{border-top:1px solid var(--line);padding:8px}
.userbtn{width:100%;display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r-md)}
.userbtn:hover{background:var(--hover)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--brand-100);color:var(--brand-700);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.user-nm{display:block;font-size:12.5px;font-weight:600;line-height:1.25}
.user-role{display:block;font-size:11px;color:var(--ink-500);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbtn .ico:last-child{margin-left:auto;color:var(--ink-400)}
.rail-collapsed .brand-txt,.rail-collapsed .btn-new span,.rail-collapsed .nav-i span:not(.tag),.rail-collapsed .nav-i .tag,.rail-collapsed .proj,.rail-collapsed .tree-head,.rail-collapsed .rail-scroll,.rail-collapsed .rail-div,.rail-collapsed .tree-search,.rail-collapsed .user-nm,.rail-collapsed .user-role,.rail-collapsed .userbtn .ico:last-child{display:none}
.rail-collapsed .brand{justify-content:center;padding-bottom:12px}
.rail-collapsed .btn-new{width:38px;margin:0 auto}
.rail-collapsed .nav-i{justify-content:center;padding:0;height:38px}
.rail-collapsed .rail-nav{padding:8px 12px}
.rail-collapsed .userbtn{justify-content:center}
.rail-collapsed .rail-foot{padding:8px 0}

/* ---- 顶栏 / 提示条 / 标签 ---- */
.topbar{flex:none;height:54px;display:flex;align-items:center;gap:10px;padding:0 14px 0 18px;border-bottom:1px solid var(--line);background:var(--paper)}
.crumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-500);white-space:nowrap}
.crumb .ico{width:12px;height:12px}
.top-title{font-size:14.5px;font-weight:650;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chips{display:flex;align-items:center;gap:6px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 8px;border:1px solid var(--line);border-radius:5px;background:var(--paper);font-size:11px;color:var(--ink-600);white-space:nowrap}
.chip .ico{width:12px;height:12px;color:var(--ink-400)}
.chip.brand{background:var(--brand-50);border-color:var(--brand-200);color:var(--brand-700);font-weight:600}
.chip.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.chip.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:3px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--paper);font-size:12px;font-weight:600;color:var(--ink-700);white-space:nowrap;transition:background .14s,border-color .14s,transform .14s}
.btn:hover:not(:disabled){background:var(--hover);border-color:var(--brand-300)}
.btn.primary{background:var(--brand-500);border-color:var(--brand-500);color:var(--on-brand)}
.btn.primary:hover:not(:disabled){background:var(--brand-600);border-color:var(--brand-600)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-600)}
.btn.ghost:hover:not(:disabled){background:var(--hover)}
.btn.sm{height:26px;padding:0 9px;font-size:11px}
.btn .ico{width:14px;height:14px}
.notice{flex:none;display:flex;align-items:center;gap:8px;height:38px;padding:8px 18px;background:var(--brand-50);border-bottom:1px solid var(--brand-100);font-size:11.5px;color:var(--brand-700)}
.notice strong{font-weight:700;letter-spacing:.02em}
.notice .sep{color:var(--brand-300)}
.notice .ico{width:13px;height:13px}
.notice .link{margin-left:auto;color:var(--brand-700);font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.notice .lbl-short{display:none}
.tabs{flex:none;display:flex;align-items:center;gap:2px;height:42px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--paper);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:6px;height:100%;padding:0 13px;font-size:12.5px;color:var(--ink-600);white-space:nowrap;transition:color .14s}
.tab:hover{color:var(--ink-900)}
.tab.on{color:var(--brand-700);font-weight:650}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--brand-500);border-radius:2px 2px 0 0}
.tab .ico{width:14px;height:14px}
.tab-close{width:18px;height:18px;border-radius:4px;display:grid;place-items:center;color:var(--ink-400);margin-left:2px}
.tab-close:hover{background:var(--hover);color:var(--ink-900)}
.tab-more{border-left:1px solid var(--line);margin-left:4px;padding-left:10px}

/* ---- 视图容器 ---- */
.view{display:none}
.view.on{display:block;animation:viewin .32s var(--ease) both}
@keyframes viewin{from{opacity:0;transform:translateY(7px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}*{scroll-behavior:auto!important}}

/* ---- 通用内容组件 ---- */
h2.sec{font-size:17px;font-weight:680;letter-spacing:-.02em;margin:0 0 4px}
.sec-desc{font-size:12px;color:var(--ink-500);margin:0 0 18px}
h3.sub{font-size:13.5px;font-weight:680;margin:26px 0 10px;color:var(--ink-900)}
h3.sub:first-child{margin-top:0}
.card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--paper);padding:16px 18px}
.card+.card{margin-top:12px}
.card-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-hd strong{font-size:12.5px;font-weight:680}
.card-hd .ico{color:var(--brand-500)}
.card-hd .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.tbl{width:100%;border-collapse:collapse;font-size:12px;background:var(--paper)}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-500);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle;color:var(--ink-700)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:var(--brand-50)}
.tbl .num{text-align:right}
.tbl-wrap{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--paper)}
.pill{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 7px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill .ico{width:11px;height:11px}
.p-gray{background:var(--rail-2);color:var(--ink-600);border-color:var(--line)}
.p-brand{background:var(--brand-50);color:var(--brand-700);border-color:var(--brand-200)}
.p-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.p-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.p-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-line)}
.kv{display:grid;grid-template-columns:82px 1fr;gap:7px 10px;font-size:11.5px}
.kv dt{color:var(--ink-500)}
.kv dd{margin:0;color:var(--ink-700);font-weight:550;overflow-wrap:anywhere}
.callout{display:flex;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);font-size:11.5px;line-height:1.65;color:var(--ink-600);text-wrap:pretty}
.callout .ico{width:15px;height:15px;flex:none;margin-top:2px}
.callout strong{color:var(--ink-900)}
.callout.riskA{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger)}
.callout.riskA strong{color:var(--danger)}
.callout.riskB{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.callout.riskB strong{color:var(--warn)}
.callout.info{background:var(--brand-50);border-color:var(--brand-200);color:var(--brand-700)}
.callout.info strong{color:var(--brand-700)}
.callout.info .ico{color:var(--brand-500)}
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .right{margin-left:auto;display:flex;gap:7px;align-items:center}
.segment{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--paper)}
.segment button{height:27px;padding:0 10px;font-size:11px;color:var(--ink-600);border-right:1px solid var(--line)}
.segment button:last-child{border-right:0}
.segment button:hover{background:var(--hover)}
.segment button.on{background:var(--brand-50);color:var(--brand-700);font-weight:650}
.empty{padding:36px 16px;text-align:center;color:var(--ink-500);font-size:12px;border:1px dashed var(--line-strong);border-radius:var(--r-lg)}
.empty .ico{width:22px;height:22px;color:var(--ink-400);display:block;margin:0 auto 8px}
.code{background:var(--rail);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;font-family:var(--f-mono);font-size:11.5px;line-height:1.75;color:var(--ink-700);overflow:auto;white-space:pre;margin:0}
.code .c{color:var(--ink-400)}
.code .b{color:var(--brand-700);font-weight:600}
.code .g{color:var(--ok)}
.code .r{color:var(--danger)}

/* ---- 对话视图 ---- */
.daysep{display:flex;align-items:center;gap:12px;margin:2px 0 20px;color:var(--ink-400);font-size:11px}
.daysep::before,.daysep::after{content:"";height:1px;background:var(--line);flex:1}
.msg{margin-bottom:24px}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.bubble{max-width:82%;padding:11px 14px;border-radius:var(--r-lg) var(--r-lg) 4px var(--r-lg);background:var(--brand-50);border:1px solid var(--brand-100);font-size:13.5px;line-height:1.65;color:var(--ink-900)}
.msg-meta{font-size:11px;color:var(--ink-400);margin-top:6px;padding-right:2px}
.ai-head{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-500);margin-bottom:12px;flex-wrap:wrap}
.ai-mark{width:20px;height:20px;border-radius:6px;background:var(--brand-500);color:var(--on-brand);display:grid;place-items:center}
.ai-mark .ico{width:13px;height:13px}
.ai-head strong{font-size:12px;color:var(--ink-900);font-weight:650}
.ai-head .dot{color:var(--ink-400)}
.prose{font-size:14px;line-height:1.85;color:var(--ink-700)}
.prose p{margin:0 0 14px}
.prose h3{font-size:17px;font-weight:700;color:var(--ink-900);letter-spacing:-.01em;margin:26px 0 10px;line-height:1.45}
.prose h4{font-size:14px;font-weight:680;margin:20px 0 8px;color:var(--ink-900)}
.prose strong{font-weight:680;color:var(--ink-900)}
.prose .tbl{font-size:12.5px;margin:16px 0 18px;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.prose .tbl th{background:var(--rail);padding:9px 12px}
.prose .tbl td{padding:10px 12px}
.prose .tbl tr:hover td{background:transparent}
.tools{margin:16px 0 4px;display:flex;flex-direction:column;gap:6px}
.tool{border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);overflow:hidden}
.tool summary{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:11.5px;cursor:pointer;list-style:none;color:var(--ink-600)}
.tool summary::-webkit-details-marker{display:none}
.tool summary:hover{background:var(--rail)}
.tool summary .ico{width:14px;height:14px;color:var(--brand-500)}
.tool summary .tn{font-family:var(--f-mono);font-size:11px;color:var(--ink-900);font-weight:600}
.tool summary .tp{font-family:var(--f-mono);font-size:11px;color:var(--ink-500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tool summary .td{font-size:11px;color:var(--ink-400);flex:none}
.tool summary .chev{margin-left:auto;transition:transform .18s;color:var(--ink-400)}
.tool[open] summary .chev{transform:rotate(90deg)}
.tool-body{border-top:1px solid var(--line-2);padding:10px 12px;background:var(--rail);font-family:var(--f-mono);font-size:11px;line-height:1.7;color:var(--ink-600);white-space:pre-wrap;overflow-wrap:anywhere}
.hitl{margin:18px 0 4px;border:1px solid var(--brand-200);border-radius:var(--r-lg);background:var(--brand-50);padding:14px 16px}
.hitl-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hitl-hd .ico{color:var(--brand-600)}
.hitl-hd strong{font-size:12.5px;font-weight:680;color:var(--brand-700)}
.hitl-hd .pill{margin-left:auto}
.hitl p{margin:0 0 12px;font-size:12px;line-height:1.7;color:var(--ink-700)}
.hitl-meta{font-size:11px;color:var(--brand-700);opacity:.85;margin-top:10px}
.hitl-acts{display:flex;gap:7px;flex-wrap:wrap}
.hitl.done{background:var(--ok-bg);border-color:var(--ok-line)}
.hitl.done .hitl-hd strong,.hitl.done .hitl-hd .ico{color:var(--ok)}
.hitl.done .hitl-meta{color:var(--ok)}
.msg-actions{display:flex;align-items:center;gap:3px;margin-top:14px;padding-top:8px;border-top:1px solid var(--line-2)}
.msg-actions .iconbtn{width:25px;height:25px}
.msg-actions .spacer{flex:1}
.msg-actions .stat{font-size:11px;color:var(--ink-400);padding:0 6px}

/* ---- 输入区 ---- */
.composer-wrap{display:none;flex:none;padding:10px 18px 12px;border-top:1px solid var(--line);background:var(--paper)}
.app.chat-view .composer-wrap{display:block}
.composer{border:1px solid var(--line-strong);border-radius:var(--r-lg);background:var(--paper);box-shadow:var(--shadow-1);padding:10px 12px 9px;transition:border-color .16s,box-shadow .16s}
.composer:focus-within{border-color:var(--brand-300);box-shadow:0 0 0 3px var(--brand-50)}
.composer textarea{width:100%;min-height:42px;max-height:140px;resize:vertical;border:0;outline:0;background:transparent;font-size:13.5px;line-height:1.6;padding:2px 2px 6px}
.composer textarea::placeholder{color:var(--ink-500)}
.composer-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.composer-row .right{margin-left:auto;display:flex;align-items:center;gap:5px}
.ctrl{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 8px;border:1px solid transparent;border-radius:var(--r-sm);font-size:11px;color:var(--ink-600);white-space:nowrap}
.ctrl:hover:not(:disabled){background:var(--hover);border-color:var(--line)}
.ctrl .ico{width:14px;height:14px}
.ctrl.square{width:27px;padding:0;justify-content:center}
.ctrl.locked{color:var(--brand-700);background:var(--brand-50);border-color:var(--brand-100)}
.send{width:30px;height:30px;border-radius:9px;background:var(--brand-500);color:var(--on-brand);display:grid;place-items:center;transition:transform .16s var(--ease),background .16s}
.send:hover:not(:disabled){background:var(--brand-600);transform:translateY(-2px)}
.send .ico{width:16px;height:16px;stroke-width:2}
.lockbar{margin:0 auto 7px;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-500)}
.lockbar .pill{height:18px}
.statusbar{flex:none;height:27px;display:flex;align-items:center;gap:16px;padding:0 18px;border-top:1px solid var(--line);background:var(--rail);font-size:11px;color:var(--ink-500);white-space:nowrap;overflow:hidden}
.statusbar .ico{width:12px;height:12px;color:var(--ink-400)}
.statusbar .sitem2{display:inline-flex;align-items:center;gap:5px}
.statusbar .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.statusbar .flag{color:var(--brand-700);font-weight:600}
.spin{width:13px;height:13px;border:2px solid var(--brand-200);border-top-color:var(--brand-500);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.dos-sec{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.dos-sec:last-child{border-bottom:0;margin-bottom:0}
.dos-ttl{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink-500);margin:0 0 9px}
.dos-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 12px}
.dos-card+.dos-card{margin-top:8px}
.dos-id{font-family:var(--f-mono);font-size:11px;color:var(--brand-700);font-weight:700}
.dos-title{font-size:12.5px;font-weight:650;line-height:1.5;margin:5px 0 9px}
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--ink-500);position:relative;padding:3px 0}
.step::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--paper);flex:none;z-index:1}
.step:not(:last-child)::after{content:"";position:absolute;left:4px;top:16px;bottom:-5px;width:1px;background:var(--line-strong)}
.step.done{color:var(--ink-600)}
.step.done::before{background:var(--brand-500);border-color:var(--brand-500)}
.step.now{color:var(--brand-700);font-weight:680}
.step.now::before{background:var(--paper);border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-100)}
.dos-row{display:flex;align-items:center;gap:7px;font-size:11px;padding:5px 0;border-bottom:1px solid var(--line-2)}
.dos-row:last-child{border-bottom:0}
.dos-row .k{color:var(--ink-500);width:60px;flex:none}
.dos-row .v{color:var(--ink-700);font-weight:550;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.risk-mini{padding:9px 10px;border-radius:var(--r-md);font-size:11px;line-height:1.6}
.risk-mini+.risk-mini{margin-top:7px}
.risk-mini strong{display:block;font-size:11px;margin-bottom:3px}
.risk-mini.a{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-line)}
.risk-mini.b{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}

/* ---- 轨迹 / 编队 / 其他 ---- */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--line-strong)}
.tl{position:relative;padding:0 0 16px}
.tl::before{content:"";position:absolute;left:-19px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line-strong)}
.tl.hl::before{background:var(--brand-500);border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-50)}
.tl.err::before{background:var(--danger);border-color:var(--danger)}
.tl-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-time{font-family:var(--f-mono);font-size:11px;color:var(--ink-400)}
.tl-name{font-size:12px;font-weight:650;color:var(--ink-900)}
.tl-body{margin-top:5px;font-size:11.5px;color:var(--ink-600);line-height:1.65}
.tl-body .mono{font-size:11px}
.tl-anchor{display:inline-flex;gap:5px;align-items:center;margin-top:6px;font-family:var(--f-mono);font-size:11px;color:var(--ink-400)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.statline{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:11.5px}
.statline:last-child{border-bottom:0}
.statline .k{color:var(--ink-500);width:104px;flex:none}
.statline .v{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-900);font-weight:600;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.statline .note{margin-left:auto;font-size:11px;color:var(--ink-400);text-align:right;flex:none;max-width:130px}
.matrix{display:grid;grid-template-columns:140px repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;font-size:11px;background:var(--paper)}
.matrix>*{min-width:0}
.matrix>div{padding:9px 10px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2)}
.matrix>div:nth-child(7n){border-right:0}
.matrix .mh{background:var(--rail);font-weight:700;color:var(--ink-600);font-size:11px}
.matrix .mk{font-weight:600;color:var(--ink-700)}
.matrix .yes{color:var(--ok)}
.matrix .no{color:var(--ink-400)}
.layer{border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);padding:11px 13px;margin-bottom:8px}
.layer-hd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:680;margin-bottom:5px}
.layer-hd .ico{color:var(--brand-500)}
.layer p{margin:0;font-size:11px;color:var(--ink-500);line-height:1.65}
.layer .lbadge{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--brand-700);background:var(--brand-50);padding:2px 6px;border-radius:4px}
.tree-code{font-family:var(--f-mono);font-size:11.5px;line-height:1.85;color:var(--ink-700);white-space:pre;overflow:auto}
.tree-code .b{color:var(--brand-700);font-weight:600}
.tree-code .c{color:var(--ink-400)}
.tree-code .w{color:var(--warn)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.sw{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--paper)}
.sw .chipc{height:52px}
.sw .swt{padding:7px 9px;font-size:11px;line-height:1.5}
.sw .swt b{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink-900)}
.sw .swt span{color:var(--ink-500)}
.type-row{display:flex;align-items:baseline;gap:14px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.type-row .lbl{width:110px;flex:none;font-size:11px;color:var(--ink-500);font-family:var(--f-mono)}
.type-row .sample{color:var(--ink-900);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.states{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 0}
.states .btn:disabled{opacity:.45}
.input-demo{height:31px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:0 10px;font-size:12px;background:var(--paper);outline:none;width:170px}
.input-demo:focus{border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-50)}
.input-demo.bad{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-bg)}
.input-demo:disabled{background:var(--rail);opacity:.6}
.rolechips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.rolechip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border:1px solid var(--line-strong);border-radius:16px;font-size:11.5px;color:var(--ink-600);background:var(--paper)}
.rolechip:hover{border-color:var(--brand-300);color:var(--ink-900)}
.rolechip.on{background:var(--brand-500);border-color:var(--brand-500);color:var(--on-brand);font-weight:650}
.rolechip .ico{width:13px;height:13px}

/* ---- 浮层 ---- */
.pop{position:fixed;z-index:60;min-width:190px;max-width:330px;background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--r-md);box-shadow:var(--shadow-2);padding:6px;display:none;animation:popin .16s var(--ease) both}
.pop.on{display:block}
@keyframes popin{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.pop-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:var(--r-sm);font-size:12px;color:var(--ink-700);text-align:left}
.pop-item:hover{background:var(--hover)}
.pop-item.on{background:var(--brand-50);color:var(--brand-700);font-weight:650}
.pop-item .ico{width:14px;height:14px;color:var(--ink-400)}
.pop-item.on .ico{color:var(--brand-500)}
.pop-item small{margin-left:auto;font-size:11px;color:var(--ink-400);font-weight:400}
.pop-sep{height:1px;background:var(--line);margin:5px 4px}
.pop-body{padding:10px 11px;font-size:11.5px;line-height:1.7;color:var(--ink-600)}
.pop-body strong{color:var(--ink-900)}
.pop-body h4{margin:0 0 6px;font-size:12px;color:var(--ink-900)}
.pop-body p{margin:0 0 8px}
.pop-body p:last-child{margin-bottom:0}
.toast{position:fixed;left:50%;bottom:52px;transform:translate(-50%,12px);z-index:80;background:var(--ink-900);color:var(--paper);border-radius:var(--r-md);padding:9px 15px;font-size:12px;box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s var(--ease);max-width:min(460px,90vw);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
html[data-theme="dark"] .toast{background:var(--brand-500);color:var(--on-brand)}
.scrim{display:none;position:fixed;inset:0;background:rgba(10,24,30,.35);z-index:40}
.scrim.on{display:block}

/* ---- 响应式 ---- */
@media(max-width:1400px){
  .crumb{display:none}
  .chips .chip.opt{display:none}
  .top-title{min-width:150px}
}
@media(max-width:1240px){
  .chips .chip.opt2{display:none}
}
@media(max-width:1080px){
  .chips .chip.opt2{display:none}
}
@media(max-width:820px){
  :root{--rail-w:64px}
  .brand-txt,.btn-new span,.nav-i span:not(.tag),.nav-i .tag,.proj,.tree-head,.rail-scroll,.rail-div,.tree-search,.user-nm,.user-role,.userbtn .ico:last-child{display:none}
  .brand{justify-content:center;padding-bottom:12px}
  .btn-new{width:38px;margin:0 auto}
  .nav-i{justify-content:center;padding:0;height:38px}
  .rail-nav{padding:8px 12px}
  .userbtn{justify-content:center}
  .rail-foot{padding:8px 0}
  .rail-head{padding:14px 12px 8px}
  .hamb{display:grid!important}
  .reader{padding:20px 18px 26px}
  .wide{padding:20px 18px 36px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .crumb{display:none}
}
@media(max-width:620px){
  .app{display:block;height:100dvh}
  .main{height:100dvh;display:flex;flex-direction:column}
  .rail{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:50;transform:translateX(-100%);transition:transform .26s var(--ease)}
  .app.rail-open .rail{transform:translateX(0)}
  .brand-txt{display:block}
  .btn-new span,.nav-i span:not(.tag){display:inline}
  .proj,.rail-scroll,.rail-div{display:block}
  .tree-head{display:flex}
  .user-nm,.user-role,.brand-name,.brand-sub,.proj-nm,.proj-mt{display:block}
  .userbtn .ico:last-child{display:inline-block}
  .rail .btn-new span{display:inline}
  .btn-new{width:100%;margin:0}
  .nav-i{justify-content:flex-start;padding:0 10px;height:34px}
  .rail-nav{padding:12px 8px 6px}
  .userbtn{justify-content:flex-start}
  .rail-foot{padding:8px}
  .rail-head{padding:16px 14px 10px}
  .brand{justify-content:flex-start}
  .rail-collapsed .rail-scroll,.rail-collapsed .proj{display:block}
  .rail-collapsed .tree-head{display:flex}
  .topbar{padding-left:10px;gap:6px}
  .top-title{font-size:13px}
  .chips{display:none}
  .notice{font-size:11px;padding:8px 12px;gap:5px}
  .notice .mid,.notice .sep{display:none}
  .notice .lbl-full{display:none}
  .notice .lbl-short{display:inline}
  .notice strong{white-space:nowrap}
  .iconbtn{width:40px;height:40px}
  .ctrl{height:40px}
  .ctrl.square{width:40px}
  .send{width:40px;height:40px;border-radius:11px}
  .btn,.btn.sm{height:40px}
  .btn.ghost{height:40px}
  .nav-i,.dnode-main{height:40px}
  .sitem{height:38px}
  .rolechip,.segment button,.tab-close{height:40px;min-width:40px}
  .userbtn{min-height:40px}
  .statusbar{gap:10px;padding:0 12px}
  .statusbar .sitem2.opt{display:none}
  .composer-wrap{padding:8px 10px 10px}
  .composer-row .right{width:100%;justify-content:flex-end;margin-left:0}
  .top-actions .btn.sm{display:none}
  .matrix{grid-template-columns:96px repeat(6,minmax(0,1fr));font-size:10px}
  .tabs{padding:0 6px}
  .tab{padding:0 10px}
}
.hamb{display:none;width:30px;height:30px;place-items:center;border-radius:var(--r-sm);color:var(--ink-600)}
.hamb:hover{background:var(--hover)}


/* ==================== v2：信息架构与交互组件 ==================== */
.rail-topbar{display:flex;align-items:center;gap:9px;padding:14px 12px 10px 14px;min-height:56px}
.brand-mark{border:0;padding:0;position:relative;cursor:default;overflow:hidden}
.brand-mark .expand{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.brand-mark .logo,.brand-mark .expand{width:17px;height:17px;stroke-width:1.9}
.rail-toggle{margin-left:auto;width:28px;height:28px;flex:none;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-500);transition:background .14s,color .14s}
.rail-toggle:hover{background:var(--hover);color:var(--ink-900)}
.rail-toggle .ico{transition:transform .2s var(--ease)}
.proj-card{margin:0 12px 8px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);box-shadow:var(--shadow-1);overflow:hidden}
.proj-card-main{display:flex;align-items:center;gap:9px;width:100%;padding:10px 10px 9px;text-align:left;cursor:default}
.proj-sq{width:26px;height:26px;border-radius:7px;background:var(--brand-100);color:var(--brand-700);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.proj-card-nm{display:block;font-size:12.5px;font-weight:680;color:var(--ink-900);line-height:1.3}
.proj-card-mt{display:block;font-size:11px;color:var(--ink-500);line-height:1.4}
.proj-card-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line-2);background:var(--rail)}
.proj-card-stat{padding:7px 4px;text-align:center;border-right:1px solid var(--line-2)}
.proj-card-stat:last-child{border-right:0}
.proj-card-stat b{display:block;font-size:13px;font-weight:700;color:var(--ink-900);font-variant-numeric:tabular-nums;line-height:1.3}
.proj-card-stat span{display:block;font-size:11px;color:var(--ink-500)}
.proj-card-risk{display:flex;align-items:center;gap:6px;padding:7px 10px;border-top:1px solid var(--line-2);font-size:11px;color:var(--warn);background:var(--warn-bg);line-height:1.4}
.proj-card-risk .ico{width:13px;height:13px;flex:none}
.rail-group-title{display:flex;align-items:center;gap:7px;padding:12px 16px 5px;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink-500)}
.rail-group-title .ln{flex:1;height:1px;background:var(--line)}
.nav-note{font-size:11px;color:var(--ink-400);margin-left:auto;padding-right:2px}
.tree-tools .iconbtn{width:26px;height:26px}
#tree{padding:0 8px 10px}

/* 折叠态：品牌图标自身即展开控件，不再单独放展开按钮 */
.app .rail-scroll{display:block!important;min-height:0;overflow:auto}
.app.rail-collapsed:not(.rail-open) .rail-topbar{justify-content:center;padding:14px 8px 10px;min-height:0}
.app.rail-collapsed:not(.rail-open) .rail-toggle{display:none!important}
.app.rail-collapsed:not(.rail-open) .brand-mark{cursor:pointer;transition:background .18s var(--ease),transform .18s var(--ease)}
.app.rail-collapsed:not(.rail-open) .brand-mark:hover{background:var(--brand-700);transform:scale(1.08)}
.app.rail-collapsed:not(.rail-open) .brand-mark:hover .logo{display:none}
.app.rail-collapsed:not(.rail-open) .brand-mark:hover .expand{display:block}
.app.rail-collapsed:not(.rail-open) .brand-txt,
.app.rail-collapsed:not(.rail-open) .proj-card,
.app.rail-collapsed:not(.rail-open) .rail-group-title,
.app.rail-collapsed:not(.rail-open) .tree-head,
.app.rail-collapsed:not(.rail-open) .tree-search,
.app.rail-collapsed:not(.rail-open) #tree,
.app.rail-collapsed:not(.rail-open) .rail-div,
.app.rail-collapsed:not(.rail-open) .nav-label,
.app.rail-collapsed:not(.rail-open) .nav-note,
.app.rail-collapsed:not(.rail-open) .user-nm,
.app.rail-collapsed:not(.rail-open) .user-role,
.app.rail-collapsed:not(.rail-open) .userbtn .ico:last-child{display:none!important}
.app.rail-collapsed:not(.rail-open) .rail-scroll{padding:0 8px 8px}
.app.rail-collapsed:not(.rail-open) .nav-i{justify-content:center;padding:0;height:38px}
.app.rail-collapsed:not(.rail-open) .rail-foot{padding:8px 0}
.app.rail-collapsed:not(.rail-open) .userbtn{justify-content:center}
@media(max-width:620px){
  .app.rail-collapsed:not(.rail-open) .rail-scroll{overflow:hidden}
}

/* 抽屉 */

/* 表单 */
.field{margin-bottom:15px}
.field>label{display:block;font-size:12px;font-weight:650;color:var(--ink-700);margin-bottom:6px}
.field .hint{font-size:11px;color:var(--ink-500);margin-top:5px;line-height:1.6}
.input,.select,.textarea{width:100%;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--paper);padding:8px 10px;font-size:12.5px;outline:none;font-family:inherit}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-50)}
.textarea{min-height:120px;resize:vertical;font-family:var(--f-mono);font-size:11.5px;line-height:1.7}
.checks{display:flex;flex-wrap:wrap;gap:7px}
.check{display:inline-flex;align-items:center;gap:6px;min-height:29px;padding:3px 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);font-size:11.5px;color:var(--ink-600);cursor:pointer;user-select:none}
.check:hover{border-color:var(--brand-300)}
.check.on{background:var(--brand-50);border-color:var(--brand-200);color:var(--brand-700);font-weight:650}
.check .ico{width:12px;height:12px}
.check.locked{opacity:.75;cursor:default}
.check.locked:hover{border-color:var(--line-strong)}
.radio-row{display:flex;flex-wrap:wrap;gap:7px}
.radio-chip{display:inline-flex;align-items:center;gap:6px;height:29px;padding:0 11px;border:1px solid var(--line-strong);border-radius:16px;font-size:11.5px;color:var(--ink-600)}
.radio-chip.on{background:var(--brand-500);border-color:var(--brand-500);color:var(--on-brand);font-weight:650}
.readonly-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:11.5px}
.readonly-row:last-child{border-bottom:0}
.readonly-row .k{color:var(--ink-500);width:140px;flex:none}
.readonly-row .v{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-900);min-width:0;overflow-wrap:anywhere}
.readonly-row .lock{color:var(--ink-400);margin-left:auto}

/* 可点击单元格 / 开关 */
.cell-btn{display:inline-flex;align-items:center;gap:5px;min-height:var(--control-h);padding:2px 7px;border:1px dashed transparent;border-radius:5px;font-size:11.5px;color:var(--ink-700);white-space:nowrap}
.cell-btn:hover:not(:disabled){border-color:var(--brand-300);background:var(--brand-50);color:var(--brand-700)}
.cell-btn .ico{width:12px;height:12px;color:var(--ink-400)}
.switch{position:relative;width:34px;height:19px;border-radius:10px;background:var(--line-strong);flex:none;transition:background .18s;display:inline-block;vertical-align:middle}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:var(--shadow-1);transition:transform .18s var(--ease)}
.switch.on{background:var(--brand-500)}
.switch.on::after{transform:translateX(15px)}
.switch-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.switch-row:last-child{border-bottom:0}
.switch-row .txt{flex:1;min-width:0}
.switch-row .txt b{display:block;font-size:12px;font-weight:650;color:var(--ink-900)}
.switch-row .txt span{display:block;font-size:11px;color:var(--ink-500);line-height:1.5}
.switch-row .switch{margin-left:auto}

/* 活动日志 */
.activity{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--paper);padding:4px 14px}
.act{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:11.5px}
.act:last-child{border-bottom:0}
.act time{font-family:var(--f-mono);font-size:11px;color:var(--ink-400);flex:none;width:58px}
.act .who{color:var(--brand-700);font-weight:650;flex:none}
.act .what{color:var(--ink-600);min-width:0}
.act-empty{padding:18px 0;text-align:center;color:var(--ink-500);font-size:11.5px}
.log-hd{display:flex;align-items:center;gap:7px;margin:22px 0 8px;font-size:12px;font-weight:680;color:var(--ink-700)}
.log-hd .ico{color:var(--brand-500)}
.log-hd .right{margin-left:auto}

/* 配置页小组件 */
.cfg-grid{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:14px}
.cfg-list{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--paper);overflow:hidden;align-self:start}
.cfg-item{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-bottom:1px solid var(--line-2);text-align:left;font-size:12px;color:var(--ink-700)}
.cfg-item:last-child{border-bottom:0}
.cfg-item:hover{background:var(--hover)}
.cfg-item.on{background:var(--brand-50);color:var(--brand-700);font-weight:650;box-shadow:inset 2px 0 0 var(--brand-500)}
.cfg-item .ico{width:14px;height:14px;color:var(--ink-400)}
.cfg-item.on .ico{color:var(--brand-500)}
.cfg-item small{margin-left:auto;font-size:11px;color:var(--ink-400);font-weight:400}
.cfg-detail{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--paper);padding:16px 18px}
.mini-search{position:relative;margin-bottom:12px}
.mini-search .ico{position:absolute;left:10px;top:8px;color:var(--ink-400);width:14px;height:14px}
.mini-search input{width:100%;height:30px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--paper);padding:0 10px 0 30px;font-size:12px;outline:none}
.mini-search input:focus{border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-50)}
.sect-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.sect-tools .right{margin-left:auto;display:flex;gap:7px}
.inline-note{font-size:11.5px;color:var(--ink-500);line-height:1.7;margin:10px 0 0}
.badge-count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand-50);color:var(--brand-700);font-size:11px;font-weight:700}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}

@media(max-width:820px){.cfg-grid{grid-template-columns:1fr}}
@media(max-width:620px){.rail-topbar{padding-left:10px}}

/* v2.1：紧凑表格与档位联动 */
.tbl-wrap{overflow-x:auto;overflow-y:hidden}
.tbl-compact td,.tbl-compact th{white-space:nowrap}
.tbl-compact td.wrap{white-space:normal;min-width:150px;max-width:380px;line-height:1.55}
.tbl-compact .btn,.tbl-compact .cell-btn{white-space:nowrap}
.proj-card-risk.ok{background:var(--ok-bg);color:var(--ok);border-top-color:var(--ok-line)}
.proj-card-stat[data-action]{cursor:pointer;transition:background .14s}
.proj-card-stat[data-action]:hover{background:var(--brand-50)}
.tree-lbl .ico{width:12px;height:12px;color:var(--ink-400)}

/* v3：域分离 —— 需求工作域 vs 配置/系统域 */
.top-context{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.status-left{display:flex;align-items:center;gap:16px;min-width:0;overflow:hidden}
.status-left .sitem2{display:inline-flex;align-items:center;gap:5px}
.page-path{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-500);white-space:nowrap}
.page-path .ico{width:12px;height:12px;color:var(--ink-400)}
.page-path b{color:var(--ink-900);font-weight:650}
.app.config-mode{grid-template-columns:var(--rail-w) minmax(0,1fr)}
.app.config-mode .tabs{display:none}

.app.config-mode .composer-wrap{display:none}
.pop{max-height:min(74vh,640px);overflow-y:auto}
.sys-group{padding:8px 10px 4px;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--ink-500)}
.sys-foot{padding:8px 11px 4px;font-size:11px;color:var(--ink-500);line-height:1.6}
@media(max-width:820px){.top-context .chips{display:none}}

/* v5：需求树状态分组的视觉层级 */
.tree-group{margin-bottom:9px}
.tree-group:last-child{margin-bottom:2px}
.tree-lbl{display:flex;align-items:center;gap:7px;margin:0 0 4px;padding:5px 8px 5px 7px;border-radius:var(--r-sm);background:var(--rail-2);font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-600);cursor:pointer;transition:background .14s,color .14s}
.tree-lbl:hover{background:var(--hover);color:var(--ink-900)}
.tree-lbl .gdot{width:7px;height:7px;border-radius:50%;flex:none}
.tree-lbl .gtxt{flex:1}
.tree-lbl .grp-chev{width:12px;height:12px;color:var(--ink-400)}
.tree-lbl .cnt{margin-left:auto;min-width:19px;height:19px;line-height:18px;padding:0 5px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink-600);font-size:11px;font-weight:700;letter-spacing:0;text-align:center}
.tree-group[data-state="进行中"] .gdot{background:var(--brand-500)}
.tree-group[data-state="待评审"] .gdot{background:var(--warn)}
.tree-group[data-state="已归档"] .gdot{background:var(--ink-400)}
.group-body{position:relative;margin-left:9px;padding-left:8px;border-left:2px solid var(--line-strong)}
.tree-group[data-state="进行中"] .group-body{border-left-color:var(--brand-300)}
.tree-group[data-state="待评审"] .group-body{border-left-color:var(--warn-line)}
.tree-group[data-state="已归档"] .group-body{border-left-color:var(--line)}
.tree-group.collapsed .group-body{display:none}
.group-body .dnode{position:relative}
.group-body .dnode::before{content:"";position:absolute;left:-8px;top:16px;width:6px;height:1px;background:var(--line-strong)}
.tree-group[data-state="进行中"] .group-body .dnode::before{background:var(--brand-300)}
.sessions{border-left:1px dashed var(--line-strong);margin-left:14px}

/* v6：作用域归位 —— 会话标题栏 / 需求驾驶舱 / 双列主区 */
.app,.app.config-mode{grid-template-columns:var(--rail-w) minmax(0,1fr)!important}
/* v10：会话身份融入标签栏 —— 顶部从三层减为两层 */
.tabs{gap:0}
.tab-group{display:flex;align-items:center;gap:2px;flex:none;height:100%}
.tab-divider{width:1px;height:18px;background:var(--line-strong);margin:0 11px;flex:none}
.tab-session{display:flex;align-items:center;gap:7px;flex:none;min-width:0;height:100%}
.ts-ico{width:20px;height:20px;border-radius:5px;background:var(--brand-50);color:var(--brand-700);display:grid;place-items:center;flex:none}
.ts-ico .ico{width:12px;height:12px}
.ts-name{display:inline-flex;align-items:center;gap:4px;min-width:0;max-width:190px;font-size:12px;font-weight:650;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ts-name:hover{color:var(--brand-700)}
.ts-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts-name .ico{width:11px;height:11px;flex:none;color:var(--ink-400)}
.ts-meta{font-size:11px;color:var(--ink-500);white-space:nowrap;flex:none}
.tab-session .smode{width:18px;height:18px;flex:none}
.tabs .ts-more{height:26px;gap:5px;flex:none}
.ts-more .ico{width:13px;height:13px}
@media(max-width:1240px){.ts-meta{display:none}.ts-name{max-width:160px}}
@media(max-width:1000px){.tab-divider{margin:0 7px}.ts-ico{display:none}.ts-name{max-width:120px}}
@media(max-width:820px){.ts-more .lbl{display:none}.tabs .ts-more{padding:0 7px}.ts-name{max-width:110px}}
@media(max-width:620px){
  .tabs{padding:0 8px}
  .tab-group .tab{padding:0 6px}
  .tab-group .tab .ico{display:none}
  .tab-divider{margin:0 4px}
  .tab-session{gap:5px}
  .tab-session .smode{display:none}
  .ts-name{max-width:88px}
  .ts-more .ico:last-child{display:none}
  .tab-demand{padding-left:6px}
  .tab-ico{width:24px}
}
.dnode-cfg{position:absolute;right:5px;top:5px;z-index:2;width:22px;height:22px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink-500);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .14s,background .14s,color .14s}
.dnode:hover .dnode-cfg,.dnode-cfg:focus-visible{opacity:1;pointer-events:auto}
.dnode-cfg:hover{background:var(--brand-50);border-color:var(--brand-200);color:var(--brand-700)}
.dnode:hover .dnode-time{opacity:0}
@media(hover:none){.dnode-cfg{opacity:1;pointer-events:auto}.dnode .dnode-time{opacity:0}}
/* 需求驾驶舱（单列） */
.ov-wrap{max-width:940px;margin:0 auto}
.ov-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;padding:16px 18px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--paper)}
.ov-head .txt{flex:1;min-width:220px}
.ov-id{font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--brand-700)}
.ov-title{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.4;margin:3px 0 8px}
.ov-flow{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ov-step{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:14px;font-size:11.5px;color:var(--ink-600);border:1px solid var(--line);background:var(--paper)}
.ov-step.done{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok);font-weight:650}
.ov-step.now{background:var(--brand-500);border-color:var(--brand-500);color:var(--on-brand);font-weight:650}
.ov-arrow{color:var(--ink-400);font-size:11px}
.ov-sec{margin-top:22px}
.ov-sec>h3{margin:0 0 9px;font-size:13.5px;font-weight:680;color:var(--ink-900)}
.ov-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--paper);padding:14px 16px}
.ov-kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 20px}
.ov-kv .row{display:flex;gap:10px;font-size:11.5px;padding:5px 0;border-bottom:1px solid var(--line-2)}
.ov-kv .row .k{width:78px;flex:none;color:var(--ink-500)}
.ov-kv .row .v{color:var(--ink-700);font-weight:550;min-width:0;overflow-wrap:anywhere}
.ov-list{display:flex;flex-direction:column}
.ov-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:11.5px}
.ov-item:last-child{border-bottom:0}
.ov-item .ico{color:var(--brand-500)}
.ov-item .nm{flex:1;min-width:0;color:var(--ink-700)}
.ov-item .mt{color:var(--ink-500);font-size:11px}
@media(max-width:820px){.ov-kv{grid-template-columns:1fr}}

/* v7：标签栏按作用域分区 —— 左文字(会话级) / 右纯图标(需求级) */
.tab-demand{position:relative;margin-left:auto;display:flex;align-items:center;gap:3px;padding-left:14px;padding-right:4px;flex:none}
.tab-demand::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:1px;height:18px;background:var(--line-strong)}
.tab-ico{position:relative;width:30px;height:30px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-500);flex:none;transition:background .14s,color .14s}
.tab-ico .ico{width:16px;height:16px}
.tab-ico:hover{background:var(--hover);color:var(--ink-900)}
.tab-ico.on{background:var(--brand-50);color:var(--brand-700);box-shadow:inset 0 0 0 1px var(--brand-200)}
@media(max-width:820px){.tab-demand{margin-left:0;padding-left:10px}}

/* v8：统一 hover tip（替代浏览器原生 title） */
.rdws-tip{position:fixed;z-index:90;left:0;top:0;max-width:288px;min-width:96px;padding:8px 11px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--paper);box-shadow:var(--shadow-2);pointer-events:none;opacity:0;visibility:hidden;transition:opacity .13s var(--ease);font-size:11.5px;line-height:1.55;color:var(--ink-700)}
.rdws-tip.on{opacity:1;visibility:visible}
.rdws-tip b{display:block;font-size:12px;font-weight:680;color:var(--ink-900);letter-spacing:-.01em}
.rdws-tip span{display:block;margin-top:3px;color:var(--ink-500)}
.rdws-tip .tip-scope{display:inline-flex;align-items:center;height:19px;margin-top:6px;padding:0 6px;border-radius:4px;background:var(--brand-50);color:var(--brand-700);font-size:11px;font-weight:650;font-style:normal;letter-spacing:.02em}
.rdws-tip::before{content:"";position:absolute;left:var(--ax,50%);top:-5px;width:8px;height:8px;background:var(--paper);border-left:1px solid var(--line-strong);border-top:1px solid var(--line-strong);transform:translateX(-50%) rotate(45deg)}
.rdws-tip[data-side="top"]::before{top:auto;bottom:-5px;transform:translateX(-50%) rotate(225deg)}
.tab-ico:focus-visible,.tab:focus-visible,.sitem:focus-visible{outline:2px solid var(--brand-500);outline-offset:-2px}
/* 会话行：模式标记固定列，hover 时解释语义 */
.smode{cursor:help}
.sitem:hover .smode:not(.w){border-color:var(--brand-300);color:var(--brand-700)}
@media(max-width:620px){.rdws-tip{max-width:min(288px,calc(100vw - 20px))}}

/* v8.1：把宽度还给会话名称 */
.sessions{padding-left:12px}
/* v8.2：左栏 tip 向右弹出，箭头朝左 */
.rdws-tip[data-side="right"]::before{left:-5px;top:var(--ay,50%);transform:translateY(-50%) rotate(-45deg)}

/* v11 → v16：全站单一内容宽度令牌（阅读与表格共用一档） */
:root{
  --content-w:960px;  /* 所有视图 / 面板 / 对话 / 输入框统一 */
  --gutter:24px;      /* 所有断点统一的页边距 */
}
.reader{width:min(calc(100% - 2*var(--gutter)),var(--content-w));max-width:none;margin:0 auto;padding:24px 0 18px}
.ov-wrap{width:min(calc(100% - 2*var(--gutter)),var(--content-w));max-width:none;margin:0 auto}
.wide{width:min(calc(100% - 2*var(--gutter)),var(--content-w));max-width:none;margin:0 auto;padding:24px 0 48px}
.composer{width:min(calc(100% - 2*var(--gutter)),var(--content-w));max-width:none;margin:0 auto;padding:9px 12px 9px}
/* 消息区与输入区同画布、零分割线；输入卡片是画布上唯一浮起层 */
.composer-wrap{padding:6px 0 12px;border-top:0;background:var(--canvas)}
.lockbar{max-width:none;width:auto;margin:0 0 7px;padding:0 2px}
/* 窄屏仍由 --gutter 统一留边，不再叠加各自为政的横向 padding */
@media(max-width:620px){
  .composer-wrap{padding:6px 0 10px}
  .reader{padding-top:20px;padding-bottom:16px}
  .wide{padding-top:20px;padding-bottom:36px}
}
/* v11.1：按域固定档位 —— 同一需求内切 tab 不跳宽 */
/* 工作区与配置域共用 --content-w，切 tab / 开面板不再跳宽 */
.ov-wrap{width:100%;max-width:none}

/* v12：并列栅格内取消纵向堆叠规则 —— .card + .card 会误伤第二列 */
.grid2 > .card + .card,
.grid3 > .card + .card{margin-top:0}

/* v13：状态切换后的操作行控件对齐（HITL 结果态 pill + btn 混排） */
.hitl-acts{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hitl-acts > .pill{height:26px;padding:0 9px;border-radius:var(--r-sm)}

/* v14：页内一等面板 —— 取代右侧抽屉，整块内容区切换 */
.inline-panel{display:none;width:min(calc(100% - 2*var(--gutter)),var(--content-w));margin:0 auto;padding:24px 0 48px}
.inline-panel.wide{width:min(calc(100% - 2*var(--gutter)),var(--content-w))}
#content.panel-mode .view{display:none}
#content.panel-mode .inline-panel{display:block}
#app.panel-mode .tabs,#app.panel-mode .composer-wrap{display:none}
#app.panel-mode .session-head{display:none}
.panel-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.panel-tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:4px;background:var(--brand-50);color:var(--brand-700);font-size:11px;font-weight:650}
.panel-tag.ro{background:var(--rail-2);color:var(--ink-500)}
.panel-card{padding:20px 22px}
.panel-card .field{margin-bottom:16px}
.panel-card .field:last-child{margin-bottom:0}
.panel-card .callout,.panel-card .grid2{margin-top:4px}
.panel-ft{display:flex;align-items:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.panel-ft .right{margin-left:auto;display:flex;gap:8px;align-items:center}
@media(max-width:620px){.inline-panel{padding-top:20px}.panel-card{padding:16px}.panel-ft .right{width:100%;justify-content:flex-end}}

/* v15：控件高度令牌 —— 同一行内所有可交互控件严格等高 */
:root{--control-h:30px}
.btn,.btn.sm,.btn.ghost,.btn.primary{height:var(--control-h)}
.segment{height:var(--control-h)}
.segment button{height:100%}
.ctrl,.ctrl.square{height:var(--control-h)}
.ctrl.square{width:var(--control-h)}
.iconbtn{width:var(--control-h);height:var(--control-h)}
.send{width:var(--control-h);height:var(--control-h)}
.input,.select{height:var(--control-h);padding:4px 10px}
.input-demo{height:var(--control-h)}
.radio-chip,.rolechip{height:var(--control-h)}
.check{min-height:var(--control-h)}
/* 操作行里的状态标签 / 计数徽标与按钮等高，其余场景保持紧凑并居中 */
.toolbar > .pill,.toolbar .right > .pill,.hitl-acts > .pill,.panel-ft > .pill{height:var(--control-h)}
.toolbar > .badge-count{height:var(--control-h);min-width:var(--control-h);border-radius:50%}
.toolbar,.toolbar .right,.panel-ft,.panel-hd{align-items:center}
@media(max-width:620px){
  :root{--control-h:40px}
  .segment button{height:100%}
  /* 按可交互性分类：带 data-action 的徽标形态控件也是交互控件，纯展示徽标保持紧凑 */
  .pill[data-action],.chip[data-action]{min-height:var(--control-h)}
}

/* v16：需求档案主线流程轴（显眼且克制：一主色 + 中性灰） */
.flow-panel{border:1px solid var(--brand-200);border-radius:var(--r-lg);background:var(--paper);overflow:hidden;box-shadow:var(--shadow-1)}
.flow-hd{display:flex;align-items:center;gap:12px;padding:11px 18px;background:var(--brand-50);border-bottom:1px solid var(--brand-100)}
.flow-hd .fey{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--brand-700)}
.flow-hd .ftitle{font-size:12.5px;font-weight:650;color:var(--ink-900)}
.flow-meter{margin-left:auto;display:flex;align-items:center;gap:9px}
.flow-meter .num{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--brand-700);font-variant-numeric:tabular-nums}
.flow-bar{width:104px;height:5px;border-radius:3px;background:var(--brand-100);overflow:hidden}
.flow-bar i{display:block;height:100%;background:var(--brand-500);border-radius:3px;transition:width .3s var(--ease)}
.flow-track{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:24px 18px 18px}
.flow-line{position:absolute;left:7.14%;right:7.14%;top:38px;height:2px;background:var(--line);z-index:0}
.flow-line i{display:block;height:100%;background:var(--brand-500);width:var(--flow-pct,50%)}
.flow-node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.flow-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-strong);background:var(--paper);color:var(--ink-400);font-size:11px;font-weight:700;font-family:var(--f-mono);line-height:1;flex:none}
.flow-dot .ico{width:13px;height:13px;stroke-width:2.4}
.flow-node.done .flow-dot{background:var(--brand-500);border-color:var(--brand-500);color:var(--on-brand)}
.flow-node.now .flow-dot{width:32px;height:32px;border:3px solid var(--brand-500);color:var(--brand-700);box-shadow:0 0 0 6px var(--brand-100);margin-top:-2px}
.flow-name{font-size:12px;font-weight:600;color:var(--ink-600);white-space:nowrap}
.flow-node.done .flow-name{color:var(--ink-900)}
.flow-node.now .flow-name{color:var(--brand-700);font-weight:700}
.flow-state{display:inline-flex;align-items:center;justify-content:center;height:18px;padding:0 6px;border-radius:9px;font-size:11px;color:var(--ink-400);white-space:nowrap}
.flow-node.done .flow-state{color:var(--ok)}
.flow-node.now .flow-state{background:var(--brand-500);color:var(--on-brand);font-weight:650}
.flow-ft{display:flex;align-items:center;gap:7px;padding:0 18px 14px;font-size:11px;color:var(--ink-500);flex-wrap:wrap}
.flow-ft .ico{width:13px;height:13px;flex:none;color:var(--brand-500)}
@media(max-width:620px){.flow-track{padding:18px 8px 14px}.flow-dot{width:24px;height:24px}.flow-node.now .flow-dot{width:27px;height:27px}.flow-name{font-size:11px}.flow-state{display:none}.flow-line{top:32px}.flow-hd{padding:10px 12px}.flow-bar{width:64px}.flow-ft{padding:0 12px 12px}}

/* v16：需求变更 / 提交与合并 */
.chg-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.chg-stat{border:1px solid var(--line);border-radius:var(--r-md);background:var(--paper);padding:12px 14px}
.chg-stat .k{font-size:11px;color:var(--ink-500)}
.chg-stat .v{font-family:var(--f-mono);font-size:17px;font-weight:700;color:var(--ink-900);font-variant-numeric:tabular-nums;line-height:1.4}
.chg-stat .note{font-size:11px;color:var(--ink-400)}
.chg-stat.warn .v{color:var(--warn)}
.chg-check{width:16px;height:16px;border:1px solid var(--line-strong);border-radius:4px;display:grid;place-items:center;cursor:pointer;flex:none;background:var(--paper);position:relative}
.chg-check::after{content:'';position:absolute;left:50%;top:50%;width:var(--control-h);height:var(--control-h);transform:translate(-50%,-50%);border-radius:6px}
.chg-check.on{background:var(--brand-500);border-color:var(--brand-500);color:var(--on-brand)}
.chg-check .ico{width:11px;height:11px;stroke-width:2.6}
.chg-diff{font-family:var(--f-mono);font-size:11.5px;line-height:1.75;white-space:pre-wrap;background:var(--canvas);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;color:var(--ink-700);overflow-x:auto}
.chg-diff .add{color:var(--ok)}
.chg-diff .del{color:var(--danger)}
.chg-diff .meta{color:var(--ink-400)}
.chg-env{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
@media(max-width:820px){.chg-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style>
</head>

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('on'),2400)}
const pop=$('#pop');let popAnchor=null;
function closePop(){pop.classList.remove('on');pop.innerHTML='';popAnchor=null}
function openPop(anchor,html){
 hideTip();
 if(pop.classList.contains('on')&&popAnchor===anchor){closePop();return}
 popAnchor=anchor;pop.innerHTML=html;pop.classList.add('on');
 const r=anchor.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
 pop.style.left=Math.min(Math.max(8,r.left),window.innerWidth-w-8)+'px';
 pop.style.top=(r.bottom+h+8<window.innerHeight?r.bottom+6:Math.max(8,r.top-h-6))+'px';
}

function csvDownload(name,rows){
 const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1500);
}

  const ok=can(el.dataset.cap);

  if(el.dataset.s0===undefined)el.dataset.s0=el.getAttribute('data-tip-scope')||'';

/* 评审补齐：所有 MR 都写入同一张「需求 × 版本 × 仓库 × 环境 × 合入 commit」映射表 */
function createMr(did,repo,env,commit){
 const r=DB.repos.mrs;
 const row={id:Math.max(0,...r.map(x=>x.id))+1,did,env,repo,mr:'!'+(510+r.length),
  commit:commit||'—',state:'待审批',cls:'p-warn'};
 r.push(row);return row;
}
