 'set-project':el=>{S.project=el.dataset.id;const d=demandList()[0];if(!d){log('切换到空项目「'+project().name+'」');render();closePop();return}S.demand=d.id;S.session=(d.sessions[0]||{}).id||'';setHash();render();closePop();log('切换项目为「'+project().name+'」');toast('已切换项目：'+project().name)},
 'role':el=>{S.role=el.dataset.id;render();closePop();log('切换身份为「'+role().name+'」');toast('已切换身份为「'+role().name+'」，按钮权限同步变化')},
 theme:()=>{S.theme=S.theme==='light'?'dark':'light';document.documentElement.dataset.theme=S.theme;$('#themeIcon').setAttribute('href',S.theme==='dark'?'#i-sun':'#i-moon');closePop();toast(S.theme==='dark'?'已切换深色主题':'已切换浅色主题')},
 refresh:()=>{render();toast('已刷新（假数据）')},

 /* 对话 */
 'new-session':()=>openPanel('在当前需求下新建会话',
  `<div class="field"><label>所属需求</label><input class="input" value="${esc(demand().id+' · '+demand().title)}" disabled><div class="hint">会话必须挂在需求下，平台不提供全局「新会话」入口。</div></div>
   <div class="field"><label>会话名称</label><input class="input" id="nsName" placeholder="例如：3.2 回归用例补充"></div>
   <div class="field"><label>能力模板</label><select class="select" id="nsTpl">${DB.templates.map(t=>`<option>${esc(t.name)}</option>`).join('')}</select><div class="hint">按 D21，模板只影响之后新建的会话。</div></div>
   <div class="field"><label>会话模式</label><div class="radio-row"><button class="radio-chip on" data-action="ns-mode" data-v="只读">只读（推荐）</button><button class="radio-chip" data-action="ns-mode" data-v="写">写会话</button></div><div class="hint">同一时刻只允许一个写会话；选择写会释放原有写锁。</div></div>`,null,
  ()=>{const n=$('#nsName').value.trim();if(!n){toast('请填写会话名称');return false}
   const mode=($('#panelBody .radio-chip.on')||{dataset:{v:'只读'}}).dataset.v;
   const d=demand();if(mode==='写')d.sessions.forEach(s=>s.mode='只读');
   const id='s'+(Date.now()%100000);d.sessions.unshift({id,name:n,mode,model:$('#nsTpl').value,turns:0,time:'刚刚'});
   S.session=id;log('在需求 '+d.id+' 下新建会话「'+n+'」（'+mode+'）');render();toast(mode==='写'?'写会话已创建（假数据）':'已创建只读会话；如需写入请在「会话编队」里设为写会话');return true}),
 'ns-mode':el=>{el.parentElement.querySelectorAll('.radio-chip').forEach(x=>x.classList.toggle('on',x===el))},
 'set-writer':el=>{const d=demand(),id=el.dataset.sid||S.session;d.sessions.forEach(s=>s.mode=s.id===id?'写':'只读');S.session=id;log('把写锁交给会话「'+(d.sessions.find(s=>s.id===id)||{}).name+'」');render();toast('已切换写会话')},
 'release-lock':()=>{const d=demand(),w=d.sessions.find(s=>s.mode==='写');if(w){w.mode='只读';log('释放需求 '+d.id+' 的写锁');render();toast('写锁已释放，所有会话为只读')}},
 'fork-session':el=>{const d=demand(),src=d.sessions.find(s=>s.id===el.dataset.sid);if(!src)return;const id='s'+(Date.now()%100000);d.sessions.unshift({id,name:src.name+' · 派生',mode:'只读',model:src.model,turns:0,time:'刚刚'});log('从会话「'+src.name+'」派生新会话');render();toast('已派生只读会话')},
 'replay-session':el=>{const s=demand().sessions.find(x=>x.id===el.dataset.sid);openPanel('轨迹回放 · '+esc(s?s.name:''),
  `<p class="inline-note" style="margin-top:0">回放读取实例 $DSH_HOME 的 append-only JSONL，不重新调用模型。</p><div class="card"><div class="statline"><span class="k">会话</span><span class="v">${esc(s?s.name:'')}</span></div><div class="statline"><span class="k">轮次</span><span class="v">${s?s.turns:0}</span></div><div class="statline"><span class="k">事件总数</span><span class="v">${DB.events.length}</span></div></div><h3 class="sub">事件序列</h3><pre class="code">${DB.events.slice(0,5).map(e=>e.t+'  '+e.n).join('\n')}\n<span class="c">… 其余 ${Math.max(0,DB.events.length-5)} 条</span></pre>`,
  `<span class="muted" style="font-size:11.5px">探索稿 · 不连接真实轨迹文件</span><div class="right"><button class="btn sm" data-action="close-panel">关闭</button></div>`,null,{readonly:true})},
 'hitl-approve':()=>{DB.hitl[demand().id]='approved';log('批准业务 HITL「设计确认」并写入 PG 审计索引（真人 '+role().person+' / 角色 '+role().name+'）');render();toast('已批准，操作者身份已记入审计索引')},
 'hitl-reject':()=>{DB.hitl[demand().id]='rejected';log('驳回业务 HITL「设计确认」，需求退回设计阶段');render();toast('已驳回，需求退回设计阶段')},
 'hitl-reset':()=>{DB.hitl[demand().id]='pending';log('重置业务 HITL 关卡为待处理');render()},
 'copy-answer':()=>{toast('已复制这条回复（演示）')},
 send:()=>{const ta=$('#composerInput'),txt=ta.value.trim();if(!txt)return;const d=demand();(DB.sent[d.id]=DB.sent[d.id]||[]).push(
  `<article class="msg user"><div class="bubble">${esc(txt)}</div><div class="msg-meta">${esc(role().person)} · ${esc(role().name)} · 刚刚</div></article><article class="msg ai"><div class="ai-head"><span class="ai-mark">${ic('branch')}</span><strong>RDWS 助手</strong><span class="dot">·</span><span>${esc(DB.scope.personalModel)}</span><span class="dot">·</span><span>刚刚</span></div><div class="prose"><p>已收到。这是对<strong>探索稿</strong>的模拟回复：真实实现里，这条消息会经平台 BFF 转发到 DSH 实例，作为一条 append-only 事件写入 $DSH_HOME 的会话日志，并把「真人 / 角色 / 需求 / 会话」映射写入 PG 审计索引。</p></div></article>`);
  ta.value='';ta.style.height='auto';log('在需求 '+d.id+' 的会话中发送一条消息');render();$('#content').scrollTop=$('#content').scrollHeight;toast('已发送（假数据，不连接任何服务）')},

 /* 上下文 */
 'save-context':()=>{demand().context=$('#ctxText').value;log('更新需求 '+demand().id+' 的注入上下文');toast('上下文已保存到演示状态')},
 'check-cwd':()=>{DB.runtime.cwdCheck='PASS · header cwd 精确等于需求目录 · attachSession 归类正常';$('#cwdResult').textContent=DB.runtime.cwdCheck;log('校验会话 header cwd：通过');toast('cwd 校验通过')},
 'preset-menu':el=>openPop(el,DB.templates.map(t=>pItem('use-template','layers',t.name,{on:t.name===demand().preset,attrs:` data-id="${t.id}"`},t.desc)).join(''),false),
 'use-template':el=>{const t=DB.templates.find(x=>x.id===el.dataset.id);if(!t)return;demand().preset=t.name;log('把需求 '+demand().id+' 的能力模板改为「'+t.name+'」（只影响新会话）');render();closePop();toast('模板已更换；已开会话不受影响')},
 'preset-for':el=>openPop(el,DB.templates.map(t=>pItem('assign-template','layers',t.name,{on:t.name===DB.demands.find(d=>d.id===el.dataset.id).preset,attrs:` data-id="${el.dataset.id}" data-tpl="${t.id}"`})).join(''),false),
 'assign-template':el=>{const d=DB.demands.find(x=>x.id===el.dataset.id),t=DB.templates.find(x=>x.id===el.dataset.tpl);d.preset=t.name;log('需求 '+d.id+' 的能力模板改为「'+t.name+'」');render();closePop()},

 /* 轨迹 / 审计 */
 'verify-hash':()=>{log('校验哈希锚点：'+DB.events.length+' 条事件与 PG append-only 表一致');DB.runtime.verify=true;toast('哈希校验通过：'+DB.events.length+' 条事件锚点一致');render()},
 'export-trace':()=>{csvDownload('rdws-trace-summary.csv',[['时间','事件','类型','操作者','内容','锚点']].concat(DB.events.map(e=>[e.t,e.n,e.k,e.who,e.b,e.a])));log('导出轨迹摘要 CSV');toast('已导出轨迹摘要 CSV')},
 'export-audit':()=>{csvDownload('rdws-audit.csv',[['时间','事件','类型','操作者','内容']].concat(DB.events.map(e=>[e.t,e.n,e.k,e.who,e.b])));log('导出审计事件 CSV');toast('已导出审计事件 CSV')},
 'event-detail':el=>{const e=DB.events.find(x=>x.a.split(' · ')[0]===el.dataset.id);if(!e)return;openPanel('事件详情 · '+e.n,
  `<dl class="kv"><dt>时间</dt><dd class="mono">${e.t}</dd><dt>事件</dt><dd class="mono">${e.n}</dd><dt>类型</dt><dd>${e.k}</dd><dt>操作者</dt><dd>${esc(e.who)}</dd><dt>锚点</dt><dd class="mono">${e.a}</dd></dl><h3 class="sub">内容</h3><div class="callout">${ic('info')}<div>${esc(e.b)}</div></div><h3 class="sub">归属</h3><p class="inline-note">文件侧权威在 $DSH_HOME 的 append-only JSONL；PG 侧只保存身份映射与审计索引，哈希锚点与文件分离存储。</p>`,
  `<span class="muted" style="font-size:11.5px">探索稿 · 只读详情</span><div class="right"><button class="btn sm" data-action="close-panel">关闭</button></div>`,null,{readonly:true})},
 'export-demands':()=>{csvDownload('rdws-demands.csv',[['编号','需求','状态','需求人员','开发','测试','部署','能力模板','基线']].concat(demandList().map(d=>[d.id,d.title,d.state,d.owner,d.dev,d.test,d.deploy,d.preset,d.base])));log('导出需求清单 CSV');toast('已导出需求清单 CSV')},

 /* 需求管理 */
 import:()=>openPanel('批量导入需求',
  `<div class="field"><label>粘贴 CSV（表头：需求标题,需求人员,开发,测试,部署,能力模板）</label><textarea class="textarea" id="impCsv">需求标题,需求人员,开发,测试,部署,能力模板
账单导出字段补齐,陈砚,林述,周珩,顾迟,全量研发
灰度开关配置核查,陈砚,许澈,林述,顾迟,纯测试</textarea><div class="hint">导入时按标题生成需求 ID 与 preset 声明；不会创建任何会话。</div></div>
  <div class="callout info">${ic('info')}<div>导入后可在表格里逐行指派角色、更换能力模板、推进状态。会话必须基于需求创建。</div></div>`,null,
  ()=>{const lines=$('#impCsv').value.trim().split('\n').slice(1).filter(Boolean);let n=0;
   lines.forEach((line,i)=>{const c=line.split(',').map(x=>x.trim());if(!c[0])return;
    DB.demands.unshift({id:'D-'+(1100+n+i),pid:S.project,title:c[0],state:'进行中',phase:'开发中',phaseIdx:3,preset:c[5]||'全量研发',base:'a3f9c21',owner:c[1]||'陈砚',dev:c[2]||'林述',test:c[3]||'周珩',deploy:c[4]||'顾迟',time:'刚刚',repos:['billing-core'],context:'S1 输入：批量导入，待补充。',sessions:[]});n++});
   log('批量导入 '+n+' 条需求到「'+project().name+'」');render();toast('已导入 '+n+' 条需求（假数据）');return true},{wide:true}),
 'new-demand':()=>openPanel('新建需求',
  `<div class="field"><label>需求标题</label><input class="input" id="ndTitle" placeholder="例如：账单导出字段补齐"></div>
   <div class="field"><label>能力模板</label><select class="select" id="ndTpl">${DB.templates.map(t=>`<option>${esc(t.name)}</option>`).join('')}</select></div>
   <div class="field"><label>四类阶段角色</label><div class="grid2" style="gap:10px">${[['owner','需求人员'],['dev','开发'],['test','测试'],['deploy','部署']].map(([k,n])=>`<div><label style="font-size:11px;color:var(--ink-500)">${n}</label><input class="input" id="nd_${k}" value="陈砚"></div>`).join('')}</div></div>
   <div class="field"><label>基线 commit</label><input class="input" id="ndBase" value="${DB.repos.baseline}"><div class="hint">冻结基线，不自动跟随主线（D22）。</div></div>`,null,
  ()=>{const t=$('#ndTitle').value.trim();if(!t){toast('请填写需求标题');return false}
   const id='D-'+(1200+DB.demands.length);DB.demands.unshift({id,pid:S.project,title:t,state:'进行中',phase:'开发中',phaseIdx:3,preset:$('#ndTpl').value,base:$('#ndBase').value.trim()||DB.repos.baseline,owner:$('#nd_owner').value,dev:$('#nd_dev').value,test:$('#nd_test').value,deploy:$('#nd_deploy').value,time:'刚刚',repos:['billing-core'],context:'S1 输入：待补充。',sessions:[]});
   S.demand=id;S.session='';setHash();log('新建需求 '+id+'「'+t+'」');render();toast('需求已创建（假数据）');return true}),
 'stage-filter':el=>{const s=el.dataset.stage;S.stageFilter=S.stageFilter===s?null:s;log('按阶段筛选：'+(S.stageFilter||'全部'));render();toast(S.stageFilter?'已筛选阶段「'+s+'」':'已取消阶段筛选')},
 'advance-demand':el=>{const d=DB.demands.find(x=>x.id===(el.dataset.id||S.demand));if(!d||d.state==='已归档')return;
  const next=Math.min(d.phaseIdx+1,STAGES.length-1);d.phaseIdx=next;d.phase=STAGES[next];
  d.state=next===STAGES.length-1?'已归档':(next<=2?'待评审':'进行中');
  log('需求 '+d.id+' 推进到「'+d.phase+'」');render();toast('需求 '+d.id+' 已推进到「'+d.phase+'」')},
 'edit-demand':el=>{const d=DB.demands.find(x=>x.id===(el.dataset.id||S.demand));if(!d)return;
  openPanel('编辑需求 · '+d.id,
   `<div class="field"><label>需求标题</label><input class="input" id="edTitle" value="${esc(d.title)}"></div>
    <div class="field"><label>状态</label><select class="select" id="edState">${['进行中','待评审','已归档'].map(s=>`<option ${d.state===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="field"><label>能力模板</label><select class="select" id="edTpl">${DB.templates.map(t=>`<option ${d.preset===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>
    <div class="field"><label>四类阶段角色</label><div class="grid2" style="gap:10px">${[['owner','需求人员'],['dev','开发'],['test','测试'],['deploy','部署']].map(([k,n])=>`<div><label style="font-size:11px;color:var(--ink-500)">${n}</label><input class="input" id="ed_${k}" value="${esc(d[k])}"></div>`).join('')}</div></div>`,null,
   ()=>{d.title=$('#edTitle').value.trim()||d.title;d.state=$('#edState').value;d.preset=$('#edTpl').value;
    ['owner','dev','test','deploy'].forEach(k=>d[k]=$('#ed_'+k).value.trim()||d[k]);
    log('编辑需求 '+d.id+' 的标题 / 状态 / 角色 / 模板');render();toast('需求已更新（假数据）');return true})},
 assign:el=>{const d=DB.demands.find(x=>x.id===el.dataset.id),k=el.dataset.key;
  const names=DB.members.map(m=>m.name);
  openPop(el,names.map(n=>pItem('do-assign','user',n,{on:d[k]===n,attrs:` data-id="${d.id}" data-key="${k}" data-name="${n}"`})).join(''),false)},
 'do-assign':el=>{const d=DB.demands.find(x=>x.id===el.dataset.id);d[el.dataset.key]=el.dataset.name;log('需求 '+d.id+' 的 '+el.dataset.key+' 指派为 '+el.dataset.name);render();closePop()},

 /* 成员 / 权限 */
 'add-member':()=>openPanel('添加成员',
  `<div class="field"><label>姓名</label><input class="input" id="mmName" placeholder="例如：沈柯"></div>
   <div class="field"><label>${esc(project().name)} 内的身份（可多选）</label><div class="checks" id="mmRoles">${['项目管理员','需求人员','开发人员','测试人员','部署人员','项目成员'].map(r=>`<button class="check" data-action="mm-toggle" data-r="${r}">${r}</button>`).join('')}</div></div>
   <div class="field"><label>磐石计费 内的身份</label><input class="input" id="mmPs" value="项目成员"></div>`,null,
  ()=>{const n=$('#mmName').value.trim();if(!n){toast('请填写姓名');return false}
   const rs=$$('#mmRoles .check.on').map(x=>x.dataset.r);
   DB.members.push({name:n,tq:rs,ps:[$('#mmPs').value.trim()||'项目成员']});log('添加成员「'+n+'」');render();toast('成员已添加（假数据）');return true}),
 'mm-toggle':el=>el.classList.toggle('on'),
 'edit-member':el=>{const i=+el.dataset.idx,m=DB.members[i];if(!m)return;
  openPanel('编辑成员 · '+esc(m.name),
   `<div class="field"><label>${esc(project().name)} 内身份</label><div class="checks" id="emRoles">${['项目管理员','需求人员','开发人员','测试人员','部署人员','项目成员'].map(r=>`<button class="check${m.tq.includes(r)?' on':''}" data-action="mm-toggle" data-r="${r}">${m.tq.includes(r)?ic('check'):''}${r}</button>`).join('')}</div></div>
    <div class="field"><label>磐石计费 内身份（逗号分隔）</label><input class="input" id="emPs" value="${esc(m.ps.join(', '))}"></div>`,null,
   ()=>{m.tq=$$('#emRoles .check.on').map(x=>x.dataset.r);m.ps=$('#emPs').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);log('编辑成员「'+m.name+'」的项目身份');render();toast('成员身份已更新');return true})},
 'toggle-cap':el=>{const k=el.dataset.key,cur=DB.capMatrix[k]!==undefined?DB.capMatrix[k]:ROLES.find(x=>x.id===k.split('|')[1]).caps.includes(k.split('|')[0]);
  DB.capMatrix[k]=!cur;log('切换能力矩阵「'+k.replace('|',' / ')+'」为 '+(!cur?'允许':'不允许'));renderCapMatrix();toast('演示值已切换（不改变真实鉴权）')},

 /* 能力模板 */
 'pick-template':el=>{S.tpl=el.dataset.id;render()},
 'new-template':()=>{const id='tpl'+(Date.now()%100000);DB.templates.push({id,name:'新模板',desc:'待填写适用说明',skills:[],stage:'设计',write:false});S.tpl=id;log('新建能力模板');render();toast('已新建模板，请在右侧完善')},
 'toggle-skill':el=>{const t=DB.templates.find(x=>x.id===S.tpl),k=el.dataset.k,i=t.skills.indexOf(k);if(i>=0)t.skills.splice(i,1);else t.skills.push(k);
  el.classList.toggle('on');el.innerHTML=(t.skills.includes(k)?ic('check'):'')+esc(k)},
 'tpl-write':el=>{DB.templates.find(x=>x.id===S.tpl).write=el.dataset.v==='1';el.parentElement.querySelectorAll('.radio-chip').forEach(x=>x.classList.toggle('on',x===el))},
 'save-template':()=>{const t=DB.templates.find(x=>x.id===S.tpl);t.name=$('#tplName').value.trim()||t.name;t.desc=$('#tplDesc').value.trim();t.stage=$('#tplStage').value.trim();
  log('保存能力模板「'+t.name+'」（'+t.skills.length+' 项白名单能力）');render();toast('模板已保存；已开会话不受影响')},

 /* 模型 */
 'toggle-provider':el=>{const p=DB.providers.find(x=>x.id===el.dataset.id);p.on=!p.on;log((p.on?'启用':'停用')+'项目「'+project().name+'」的供应商「'+p.name+'」');render();toast('项目可用子集已更新')},
 'save-scope':()=>{DB.scope.defaultModel=$('#scopeDefault').value;DB.scope.quota=Math.max(1,Math.min(100,+$('#scopeQuota').value||37));DB.scope.personalModel=$('#scopePersonal').value;
  log('保存项目级模型配置：默认 '+DB.scope.defaultModel+' / 配额 '+DB.scope.quota+'%');render();toast('配置已保存，已同步到状态条与输入框')},

 /* 仓库 */
 sync:el=>{const b=el||$('#syncBtn');if(!b||b.disabled)return;const old=b.innerHTML;b.disabled=true;b.innerHTML='<span class="spin"></span>同步中';

/* ==================== 统一 hover tip（替代原生 title） ==================== */
const tip=$('#rdwsTip');
let tipTimer=null,tipAnchor=null;
function migrateTitles(root){
 $$('[title]',root||document).forEach(function(el){
  var t=el.getAttribute('title');
  if(t&&!el.hasAttribute('data-tip'))el.setAttribute('data-tip',t);
  el.removeAttribute('title');
 });
}
function hideTip(){
 if(tipTimer){clearTimeout(tipTimer);tipTimer=null}
 tipAnchor=null;tip.classList.remove('on');tip.setAttribute('aria-hidden','true');
}
function buildTip(el){
 var t=el.getAttribute('data-tip')||'',sub=el.getAttribute('data-tip-sub')||'',scope=el.getAttribute('data-tip-scope')||'';
 tip.textContent='';
 var b=document.createElement('b');b.textContent=t;tip.appendChild(b);
 if(sub){var sp=document.createElement('span');sp.textContent=sub;tip.appendChild(sp)}
 if(scope){var em=document.createElement('em');em.className='tip-scope';em.textContent=scope;tip.appendChild(em)}
}
function placeTip(el){
 var r=el.getBoundingClientRect();
 tip.style.visibility='hidden';tip.classList.add('on');
 var w=tip.offsetWidth,h=tip.offsetHeight,V=window.innerWidth,H=window.innerHeight;
 var left=Math.max(8,Math.min(r.left+r.width/2-w/2,V-w-8));
 var top=r.bottom+9,side='bottom',ax=Math.max(12,Math.min(r.left+r.width/2-left,w-12));
 var rail=document.getElementById('rail'),railR=rail?rail.getBoundingClientRect().right:0;
 var anchorR=Math.max(r.right,railR);
 if(el.getAttribute('data-tip-side')==='right'&&anchorR+9+w<=V-8){
  left=anchorR+9;top=Math.max(8,Math.min(r.top+r.height/2-h/2,H-h-8));side='right';
  tip.style.setProperty('--ay',Math.max(12,Math.min(r.top+r.height/2-top,h-12))+'px');
 }else{
  if(top+h>H-8){top=r.top-h-9;side='top'}
  if(top<8){top=8;side='bottom'}
 }
 tip.style.left=left+'px';tip.style.top=top+'px';tip.dataset.side=side;
 tip.style.setProperty('--ax',ax+'px');
 tip.style.visibility='visible';tip.setAttribute('aria-hidden','false');
}
function tipTargetOf(node){return node&&node.closest?node.closest('[data-tip],[title]'):null}
function tipEnter(e){
 var el=tipTargetOf(e.target);if(!el)return;
 if(el.hasAttribute('title')){var t=el.getAttribute('title');if(t&&!el.hasAttribute('data-tip'))el.setAttribute('data-tip',t);el.removeAttribute('title')}
 if(el===tipAnchor&&tip.classList.contains('on'))return;
 hideTip();tipAnchor=el;
 tipTimer=setTimeout(function(){if(tipAnchor!==el)return;buildTip(el);placeTip(el)},150);
}
function tipLeave(e){
 var el=tipTargetOf(e.target),to=tipTargetOf(e.relatedTarget);
 if(el&&to===el)return;
 if(!el||el===tipAnchor)hideTip();
}
document.addEventListener('mouseover',tipEnter);
document.addEventListener('mouseout',tipLeave);
document.addEventListener('focusin',tipEnter);
document.addEventListener('focusout',tipLeave);
document.addEventListener('click',hideTip,true);
window.addEventListener('scroll',hideTip,true);
window.addEventListener('resize',hideTip);

/* ==================== 启动 + 自检 ==================== */
if(window.innerWidth<=820)$('#app').classList.add('rail-collapsed');
parseHash();setHash();render();
const views=$$('.view').length;
const missing=[];$$('use').forEach(u=>{const id=u.getAttribute('href');if(id&&id.charAt(0)==='#'&&!document.querySelector(id))missing.push(id)});
const ext=[];$$('[src],[href]').forEach(n=>{const v=n.getAttribute('src')||n.getAttribute('href');if(v&&/^(https?:)?\/\//.test(v))ext.push(v)});
const semantic={
 mrSingleSource:DB.changes.filter(c=>c.mr!=='—').every(c=>DB.repos.mrs.some(m=>m.did===c.did&&m.mr===c.mr)),
 capCovered:Object.keys(ACTION_CAP).every(k=>typeof A[k]==='function'),
 newGates:['record-merge','archive-demand','hitl-gates','acceptance'].every(k=>typeof A[k]==='function'),
 stageRoles:ROLES.length===6&&STAGES.length===7,
 phaseInRange:DB.demands.every(d=>d.phaseIdx>=0&&d.phaseIdx<STAGES.length),
 orphanHandler:Object.keys(A).every(k=>k==='panel-save'||typeof A[k]==='function')
};
const ok=views===16&&$('#menuBox').querySelectorAll('.nav-i').length===7&&missing.length===0&&ext.length===0&&typeof A['system-menu']==='function'&&typeof A['expand-rail']==='function'&&!document.querySelector('[data-action=project-menu]')&&Object.values(semantic).every(Boolean);
document.documentElement.dataset.ready=ok?'ok':'fail';
document.documentElement.dataset.selftest=JSON.stringify({views,menu:$('#menuBox').querySelectorAll('.nav-i').length,missingIcons:missing.length,externalRefs:ext.length,view:S.view,demand:S.demand,domain:isWorkspace()?'workspace':'config',semantic});
window.__rdwsSelfTest=()=>({ok,views,menu:$('#menuBox').querySelectorAll('.nav-i').length,missingIcons:missing,externalRefs:ext,semantic,state:S,domain:isWorkspace()?'workspace':'config',activity:DB.activity.length});
})();

</script>
